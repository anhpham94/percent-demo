<!DOCTYPE html>
<html>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<div id="res"></div>
<script>
    const loader = new THREE.GLTFLoader();
    const models = ['models/apple_watch_ultra_2.glb', 'models/rolex.glb', 'models/ugia_watch.glb', 'models/ChronographWatch.glb'];
    let res = "";
    let loaded = 0;
    models.forEach(m => {
        loader.load(m, (gltf) => {
            res += m + ":\n";
            gltf.scene.traverse(c => {
                if (c.isMesh) res += "  - " + c.name + "\n";
            });
            loaded++;
            if(loaded === models.length) document.getElementById('res').innerText = res;
        });
    });
</script>
</body>
</html>
