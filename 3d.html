    };
  },
  _view: o => goView({ az: o.az, el: o.el, d: o.d, whole: o.whole, under: o.under, tg: Array.isArray(o.tg) ? new THREE.Vector3(...o.tg) : VIEWPTS[o.tg].clone() }, true),
  _cam: () => ({ pos: camera.position.toArray().map(x => +x.toFixed(1)), tg: controls ? controls.target.toArray().map(x => +x.toFixed(1)) : null, d: controls ? +camera.position.distanceTo(controls.target).toFixed(1) : 0, aspect: +camera.aspect.toFixed(3) }),
  _pts: () => Object.fromEntries(Object.entries(VIEWPTS).map(([k, v]) => [k, v && v.isVector3 ? v.toArray().map(x => +x.toFixed(1)) : v])),
  _tex: (file, grain) => leatherTex(file, grain).then(t => [t.map.image.toDataURL('image/jpeg', .9), t.nmap.image.toDataURL('image/jpeg', .9)]),
  _stampTex: () => STAMPS ? ['T', 'L'].flatMap(k => [STAMPS[k].mask.toDataURL('image/png'), STAMPS[k].nmap.image.toDataURL('image/png'), STAMPS[k].amap.image.toDataURL('image/png')]) : null,
  _probe: list => {
    const keep = { ...S }, out = [];
    try { for (const p of list) { Object.assign(S, coerce(p)); buildAll(); out.push({ p, s: window.p3d.stats() }); } }
    finally { Object.assign(S, keep); buildAll(); applyColors(); }
    return out;
  }
};
async function boot() {
  const lt = $('#p3dLoadT'), stampsP = glOK ? initStamps().catch(e => { (window.__p3dErrors = window.__p3dErrors || []).push('stamps ' + e.message); }) : null;
  if (!glOK) lt.textContent = 'Trình duyệt chưa bật WebGL nên không hiện được mô hình 3D. Hãy mở bằng Chrome hoặc Safari bản mới. Bạn vẫn chọn cấu hình và gửi Zalo được.';
  try {
    const r = await fetch('data/catalog.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('catalog ' + r.status);
    CAT = await r.json();
  } catch (e) {
    lt.textContent = 'Không tải được dữ liệu da. Kiểm tra mạng rồi tải lại trang.';
    $('#p3dBody').innerHTML = '<p class="p3d-p">Không tải được dữ liệu da Percent. Hãy tải lại trang.</p>';
    throw e;
  }
  CAT.collections.forEach(c => { COLL[c.id] = c; });
  Object.assign(S, coerce(readHash()));
  normalize();
  ui.grp = curColl().group;
  await stampsP;
  await setState({}, true);
  if (glOK) {
    goView(VIEWS.leather(), true);
    stepTween(performance.now());
    controls.update();
    renderer.render(scene, camera);
    $('#p3dLoad').classList.add('is-off');
    setTimeout(() => $('#p3dHint').classList.add('is-off'), 7000);
  }
  document.body.dataset.ready = '1';
  readyRes(true);
}
boot();
</script>
</body>
</html>
